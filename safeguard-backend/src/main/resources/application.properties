server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/kce_safeguard?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=./uploads

# JWT Security Configurations
# Secret key should be at least 256 bits (32 bytes) long
app.jwt.secret=9a4f94d94923f11d11e202532a2207612d2b56aa11e86a076757656d0283c713
app.jwt.expiration-ms=86400000

# Swagger Config (Springdoc)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
